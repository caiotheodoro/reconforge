name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge:
    name: forge tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: pytest
        working-directory: forge
        run: |
          uv sync
          uv run pytest -q

  paper:
    name: paper (numbers trace to artifacts, PDF renders)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAPER_REQUIRE_RENDER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: poppler (pdftotext, pdfinfo)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: tectonic
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
          tectonic --version
      - name: pytest (numbers, metadata, render)
        working-directory: paper
        run: |
          uv sync
          uv run pytest -q
      - name: committed generated assets are current
        working-directory: paper
        run: |
          uv run python build_assets.py
          uv run python export_metadata.py
          git diff --exit-code -- generated ../.zenodo.json
