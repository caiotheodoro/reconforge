[project]
name = "reconforge-model"
version = "0.1.0"
description = "Dataset builder, MLX-LoRA fine-tuning, and evaluation for the ReconForge reconciliation worker model."
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "huggingface-hub>=1.27.0",
    "mlx-lm>=0.22",
    "numpy",
    "openai",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconforge_model"]

# uv marks every file in its venv with the macOS hidden flag (UF_HIDDEN);
# CPython's site.addpackage silently skips hidden .pth files, which breaks
# editable installs of this package. We therefore do NOT install the project
# into the venv; src/ is put on sys.path by tests/conftest.py and by
# PYTHONPATH in scripts/smoke.sh.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
