[project]
name = "reconforge-system"
version = "0.1.0"
description = "ReconForge system: Kafka event pipeline, Temporal durable workflows, cadence schedules, HITL review flow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "kafka-python>=2.0.2",
    "temporalio>=1.8.0",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "asyncpg>=0.29",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
reconforge-ingest = "reconforge_system.services.ingest:main"
reconforge-decision = "reconforge_system.services.decision:main"
reconforge-ledger = "reconforge_system.services.ledger:main"
reconforge-gate = "reconforge_system.services.gate:main"
reconforge-hitl = "reconforge_system.services.hitl:main"
reconforge-cadence = "reconforge_system.services.cadence:main"
reconforge-schedules = "reconforge_system.schedule_registry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconforge_system"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: needs real infra (postgres/kafka/temporal test server)",
]
