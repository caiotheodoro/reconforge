[project]
name = "reconforge-knowledge"
version = "0.1.0"
description = "GraphRAG extraction, Neo4j loader, and grounded gate for ReconForge"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",
    "neo4j>=5.20",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "scikit-learn>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
